[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gridex-forecasting"
version = "0.1.0"
description = "PV, load, price and scenario-profit forecasting for GrideX Energy OS"
requires-python = ">=3.11"
dependencies = [
  "lightgbm>=4.6,<5",
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.6,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

