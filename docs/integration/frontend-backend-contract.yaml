openapi: 3.1.0
info:
  title: GrideX Frontend API
  version: 1.0.0
  description: Canonical browser-to-BFF contract. It never exposes OpenRemote service credentials or field protocols.
servers:
  - url: "{apiBaseUrl}"
    variables:
      apiBaseUrl:
        default: https://example.invalid
security:
  - oidc: []
paths:
  /health:
    get:
      security: []
      operationId: getHealth
      responses:
        "200":
          description: Backend and OpenRemote are ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/me:
    get:
      operationId: getCurrentUser
      responses:
        "200":
          description: Authenticated identity and effective roles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorised" }
  /api/v1/me/preferences:
    get:
      operationId: getCurrentUserPreferences
      responses:
        "200":
          description: Non-operational preferences for the current OIDC subject.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
    put:
      operationId: updateCurrentUserPreferences
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPreferences" }
      responses:
        "200":
          description: Updated preferences and revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
        "412": { $ref: "#/components/responses/StaleRevision" }
  /api/v1/strategies/catalog:
    get:
      operationId: getStrategyCatalog
      responses:
        "200":
          description: Strategies allowed by the effective role, plan and site capabilities.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/StrategyCatalogItem" }
  /api/v1/sites:
    get:
      operationId: listSites
      responses:
        "200":
          description: Sites authorised for the current subject.
          content:
            application/json:
              schema:
                type: object
                required: [sites]
                properties:
                  sites:
                    type: array
                    items: { $ref: "#/components/schemas/Site" }
  /api/v1/sites/{siteId}/snapshot:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      operationId: getSiteSnapshot
      responses:
        "200":
          description: Canonical current snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/sites/{siteId}/commands/power:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      operationId: requestSitePower
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PowerCommand" }
      responses:
        "202":
          description: Accepted for protected execution.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, sequence, commandId]
                properties:
                  accepted: { const: true }
                  sequence: { type: integer, minimum: 0, maximum: 65535 }
                  commandId: { type: string }
        "423": { $ref: "#/components/responses/Locked" }
  /api/v1/sites/{siteId}/history:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      operationId: getSiteHistory
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: resolution, in: query, required: true, schema: { enum: [raw, 1m, 15m, 1h, 1d] } }
        - { name: metrics, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Ordered historical points.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TimeSeriesPoint" }
  /api/v1/sites/{siteId}/forecast:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      operationId: getSiteForecast
      parameters:
        - { name: horizonHours, in: query, schema: { type: integer, minimum: 1, maximum: 168, default: 72 } }
      responses:
        "200":
          description: Weather, PV, load, market and economics forecast.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TimeSeriesPoint" }
  /api/v1/sites/{siteId}/strategy:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      operationId: getSiteStrategy
      responses:
        "200":
          description: Current canonical site strategy and revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyEnvelope" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/sites/{siteId}/strategy/drafts:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      operationId: createSiteStrategyDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [baseRevision, configuration]
              properties:
                baseRevision: { type: integer, minimum: 0 }
                configuration: { $ref: "#/components/schemas/StrategyConfiguration" }
      responses:
        "201":
          description: Draft created without changing the active site strategy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyDraft" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/sites/{siteId}/strategy/drafts/{draftId}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/DraftId"
    put:
      operationId: updateSiteStrategyDraft
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [configuration]
              properties:
                configuration: { $ref: "#/components/schemas/StrategyConfiguration" }
      responses:
        "200":
          description: Updated draft and validation summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyDraft" }
        "412": { $ref: "#/components/responses/StaleRevision" }
  /api/v1/sites/{siteId}/strategy/drafts/{draftId}/validate:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/DraftId"
    post:
      operationId: validateSiteStrategyDraft
      responses:
        "200":
          description: Schema, permission, capability, tariff and safety-relationship validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyValidation" }
  /api/v1/sites/{siteId}/strategy/drafts/{draftId}/simulate:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/DraftId"
    post:
      operationId: simulateSiteStrategyDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [horizonFrom, horizonTo]
              properties:
                horizonFrom: { type: string, format: date-time }
                horizonTo: { type: string, format: date-time }
      responses:
        "202":
          description: Simulation queued or completed by an inline backend implementation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategySimulation" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/sites/{siteId}/strategy/drafts/{draftId}/activate:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/DraftId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: activateSiteStrategyDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedDraftRevision, simulationId]
              properties:
                expectedDraftRevision: { type: integer, minimum: 0 }
                simulationId: { type: string }
                approvalReason: { type: string, maxLength: 1000 }
      responses:
        "202":
          description: Accepted for OpenRemote activation; not yet proof of application.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyStatus" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/StaleRevision" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "423": { $ref: "#/components/responses/Locked" }
  /api/v1/sites/{siteId}/strategy/status:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      operationId: getSiteStrategyStatus
      responses:
        "200":
          description: Desired versus OpenRemote-applied revision and safety readiness.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyStatus" }
  /api/v1/sites/{siteId}/strategy/versions:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      operationId: listSiteStrategyVersions
      responses:
        "200":
          description: Audited immutable site strategy history.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/StrategyEnvelope" }
  /api/v1/sites/{siteId}/events:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      operationId: streamSiteEvents
      responses:
        "200":
          description: Authenticated server-sent events stream.
          content:
            text/event-stream:
              schema: { type: string }
  /api/v1/sites/{siteId}/alarms:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      operationId: listSiteAlarms
      responses:
        "200":
          description: Site alarms visible to the current subject.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Alarm" }
  /api/v1/sites/{siteId}/alarms/{alarmId}/acknowledge:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - name: alarmId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: acknowledgeSiteAlarm
      responses:
        "204": { description: Alarm acknowledged and audit record created. }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/sites/{siteId}/configurations/{section}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - name: section
        in: path
        required: true
        description: Strategy uses its dedicated lifecycle endpoints and is not a value here.
        schema: { enum: [battery-asset, tariff, forecast, grid, evse, notifications, trader-schedule, balancing] }
    get:
      operationId: getSiteConfiguration
      responses:
        "200":
          description: Current versioned configuration section.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [revision, configuration]
                properties:
                  revision: { type: integer, minimum: 0 }
                  configuration: { type: object, additionalProperties: true }
    put:
      operationId: updateSiteConfiguration
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: New canonical configuration and revision.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "412":
          description: The supplied revision is stale.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://example.invalid/realms/example/.well-known/openid-configuration
  parameters:
    SiteId:
      name: siteId
      in: path
      required: true
      schema: { type: string }
    DraftId:
      name: draftId
      in: path
      required: true
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
  responses:
    Unauthorised:
      description: Missing, expired or revoked session.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Role or site access denied.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Locked:
      description: Control writes are locked until commissioning.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unavailable:
      description: Backend or required upstream is unavailable.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Current site state conflicts with the requested transition.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    StaleRevision:
      description: The supplied revision or ETag is stale.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ValidationFailed:
      description: Configuration, capability or simulation validation failed.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    StrategyConfiguration:
      $ref: "./schemas/strategy-configuration.schema.json"
    UserPreferences:
      $ref: "./schemas/user-preferences.schema.json"
    StrategyLifecycle:
      enum: [draft, validating, invalid, ready, activating, active, rejected, superseded]
    StrategyCatalogItem:
      type: object
      additionalProperties: false
      required: [code, label, description, requiredCapabilities, requiredRoles, simulationRequired]
      properties:
        code: { $ref: "#/components/schemas/StrategyCode" }
        label: { $ref: "#/components/schemas/BilingualText" }
        description: { $ref: "#/components/schemas/BilingualText" }
        requiredCapabilities: { type: array, items: { type: string } }
        requiredRoles: { type: array, items: { type: string } }
        simulationRequired: { type: boolean }
    StrategyCode:
      enum: [intelligent_hybrid, price_arbitrage, self_consumption, zero_export, peak_shaving, schedule_following, backup_reserve, manual]
    BilingualText:
      type: object
      additionalProperties: false
      required: [en, bg]
      properties:
        en: { type: string }
        bg: { type: string }
    StrategyEnvelope:
      type: object
      required: [siteId, revision, etag, lifecycle, configuration, createdAt, createdBy]
      properties:
        siteId: { type: string }
        revision: { type: integer, minimum: 0 }
        etag: { type: string }
        lifecycle: { $ref: "#/components/schemas/StrategyLifecycle" }
        configuration: { $ref: "#/components/schemas/StrategyConfiguration" }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
    StrategyDraft:
      allOf:
        - { $ref: "#/components/schemas/StrategyEnvelope" }
        - type: object
          required: [draftId, baseRevision, validation]
          properties:
            draftId: { type: string }
            baseRevision: { type: integer, minimum: 0 }
            validation: { $ref: "#/components/schemas/StrategyValidation" }
    StrategyValidation:
      type: object
      required: [valid, errors, warnings]
      properties:
        valid: { type: boolean }
        errors:
          type: array
          items: { $ref: "#/components/schemas/ValidationMessage" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/ValidationMessage" }
    ValidationMessage:
      type: object
      required: [path, code, message]
      properties:
        path: { type: string }
        code: { type: string }
        message: { type: string }
    StrategySimulation:
      type: object
      required: [simulationId, draftId, status, horizonFrom, horizonTo, inputVersions, violations]
      properties:
        simulationId: { type: string }
        draftId: { type: string }
        status: { enum: [queued, running, completed, failed] }
        horizonFrom: { type: string, format: date-time }
        horizonTo: { type: string, format: date-time }
        inputVersions: { type: object, additionalProperties: { type: string } }
        projected:
          type: object
          properties:
            grossRevenue: { type: number }
            energyCost: { type: number }
            imbalanceCost: { type: number }
            batteryDegradationCost: { type: number }
            netProfit: { type: number }
            equivalentFullCycles: { type: number, minimum: 0 }
            minimumSocPct: { type: number, minimum: 0, maximum: 100 }
            maximumGridImportKw: { type: number, minimum: 0 }
            maximumGridExportKw: { type: number, minimum: 0 }
        violations:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
              timestamp: { type: string, format: date-time }
    StrategyStatus:
      type: object
      required: [siteId, code, lifecycle, desiredRevision, rejectionReasons, safety]
      properties:
        siteId: { type: string }
        code: { $ref: "#/components/schemas/StrategyCode" }
        lifecycle: { $ref: "#/components/schemas/StrategyLifecycle" }
        desiredRevision: { type: integer, minimum: 0 }
        appliedRevision: { type: integer, minimum: 0 }
        openRemoteAssetId: { type: string }
        requestedAt: { type: string, format: date-time }
        appliedAt: { type: string, format: date-time }
        requestedBy: { type: string }
        rejectionReasons:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
        safety:
          type: object
          required: [limitsValid, controlReady, writesEnabled, edgeOnline]
          properties:
            limitsValid: { type: boolean }
            controlReady: { type: boolean }
            writesEnabled: { type: boolean }
            edgeOnline: { type: boolean }
    Health:
      type: object
      required: [status, openRemote]
      properties:
        status: { enum: [ready, degraded] }
        openRemote: { enum: [online, offline] }
        writesEnabled: { type: boolean }
    User:
      type: object
      required: [subject, roles]
      properties:
        subject: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        preferredUsername: { type: string }
        roles: { type: array, items: { type: string } }
    Site:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string }
        timezone: { type: string }
        marketCode: { type: string }
    Snapshot:
      type: object
      required: [assetId, timestamp, quality, battery, power]
      properties:
        assetId: { type: string }
        siteId: { type: string }
        siteName: { type: string }
        timestamp: { type: string, format: date-time }
        quality: { enum: [GOOD, STALE, INVALID, FAULT] }
        battery:
          type: object
          required: [socPct, sohPct, maxChargeKw, maxDischargeKw, limitsValid]
          properties:
            socPct: { type: number, minimum: 0, maximum: 100 }
            sohPct: { type: number, minimum: 0, maximum: 100 }
            maxChargeKw: { type: number, minimum: 0 }
            maxDischargeKw: { type: number, minimum: 0 }
            limitsValid: { type: boolean }
            controlReady: { type: boolean }
        power:
          type: object
          required: [actualKw, requestedKw, appliedKw]
          properties:
            actualKw: { type: number, description: Positive discharge; negative charge. }
            requestedKw: { type: number }
            appliedKw: { type: number }
            dcKw: { type: number }
            reactiveKvar: { type: number }
            pvKw: { type: number, minimum: 0 }
            siteLoadKw: { type: number, minimum: 0 }
            gridKw: { type: number, description: Positive import; negative export. }
            evKw: { type: number, minimum: 0 }
        strategy:
          type: object
          properties:
            mode: { type: string }
            targetSocPct: { type: number, minimum: 0, maximum: 100 }
    PowerCommand:
      type: object
      additionalProperties: false
      required: [sequence, requestedPowerKw, enable, source, ttlSeconds]
      properties:
        sequence: { type: integer, minimum: 0, maximum: 65535 }
        requestedPowerKw: { type: number, minimum: -3276.8, maximum: 3276.7 }
        enable: { type: boolean }
        source: { enum: [automatic, schedule, operator, safe-mode] }
        ttlSeconds: { type: integer, minimum: 1, maximum: 60 }
    Alarm:
      type: object
      required: [id, siteId, severity, state, title, createdAt]
      properties:
        id: { type: string }
        siteId: { type: string }
        severity: { enum: [info, warning, critical] }
        state: { enum: [open, acknowledged, closed] }
        title: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }
    TimeSeriesPoint:
      type: object
      required: [timestamp, values]
      properties:
        timestamp: { type: string, format: date-time }
        values: { type: object, additionalProperties: true }
        quality: { enum: [GOOD, STALE, INVALID, FAULT] }
        confidencePct: { type: number, minimum: 0, maximum: 100 }
        model: { type: string }
    Error:
      type: object
      required: [error, requestId]
      properties:
        error: { type: string }
        message: { type: string }
        requestId: { type: string }
        details: { type: object, additionalProperties: true }
